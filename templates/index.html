<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watson NLP - Emotion Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="/static/mywebscript.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-accent: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .main-container {
            width: 100%;
            max-width: 820px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-header-custom {
            padding: 35px 35px 20px 35px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .app-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 9999px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .app-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .app-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        .card-body-custom {
            padding: 35px;
        }

        .form-label-custom {
            font-size: 1rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .custom-textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 12px !important;
            color: #ffffff !important;
            font-size: 1rem;
            padding: 14px 16px;
            min-height: 110px;
            resize: vertical;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .custom-textarea:focus {
            outline: none !important;
            border-color: #818cf8 !important;
            box-shadow: 0 0 0 4px var(--primary-glow) !important;
        }

        .custom-textarea::placeholder {
            color: #64748b;
        }

        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 24px;
        }

        .chip-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            align-self: center;
            margin-right: 4px;
        }

        .chip-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #818cf8;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-analyze {
            width: 100%;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            transition: all 0.25s ease;
        }

        .btn-analyze:hover:not(:disabled) {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            box-shadow: 0 14px 28px -6px rgba(79, 70, 229, 0.6);
            transform: translateY(-2px);
        }

        .btn-analyze:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .result-section {
            margin-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 25px;
        }

        .result-title {
            font-size: 1rem;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Modern Spinner Loader */
        .analysis-loader {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            padding: 40px 20px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px dashed rgba(99, 102, 241, 0.3);
            border-radius: 14px;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { border-color: rgba(99, 102, 241, 0.3); }
            50% { border-color: rgba(99, 102, 241, 0.7); }
        }

        .loader-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #818cf8;
            border-right: 3px solid #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            text-align: center;
        }

        .loader-text strong {
            display: block;
            color: #f1f5f9;
            font-size: 0.95rem;
        }

        .loader-text span {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Results dashboard */
        .result-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 24px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dominant-badge-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 20px;
        }

        .dominant-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .dominant-value {
            font-size: 1.15rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 16px;
            border-radius: 9999px;
            text-transform: capitalize;
        }

        .emotion-bars {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .emotion-row {
            display: grid;
            grid-template-columns: 85px 1fr 60px;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }

        .emotion-name {
            color: #cbd5e1;
            font-weight: 600;
            text-transform: capitalize;
        }

        .progress-track {
            background: rgba(255, 255, 255, 0.08);
            height: 10px;
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .emotion-score {
            color: var(--text-muted);
            font-family: monospace;
            text-align: right;
            font-weight: 600;
        }

        .raw-system-output {
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid #818cf8;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            font-size: 0.88rem;
            color: #cbd5e1;
            margin-bottom: 0;
            line-height: 1.5;
        }

        .alert-error-card {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 16px 20px;
            color: #fca5a5;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="glass-card">
            <div class="card-header-custom">
                <div class="app-badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                    IBM Watson NLP AI
                </div>
                <h1 class="app-title">Emotion Detection</h1>
                <p class="app-subtitle">Real-time affective sentiment intelligence powered by NLP</p>
            </div>

            <div class="card-body-custom">
                <label class="form-label-custom" for="textToAnalyze">
                    <span>Enter text to be analyzed:</span>
                </label>

                <textarea
                    id="textToAnalyze"
                    class="custom-textarea"
                    placeholder="Type or paste any phrase here, e.g., 'I am so excited about this opportunity!'..."
                ></textarea>

                <div class="quick-chips">
                    <span class="chip-label">Quick samples:</span>
                    <button type="button" class="chip-btn" onclick="setSampleText('I am so glad and happy this happened!')">😊 Joy</button>
                    <button type="button" class="chip-btn" onclick="setSampleText('I am really furious and mad about this!')">😡 Anger</button>
                    <button type="button" class="chip-btn" onclick="setSampleText('This is completely revolting and disgusting.')">🤢 Disgust</button>
                    <button type="button" class="chip-btn" onclick="setSampleText('I am terrified and full of dread and fear.')">😨 Fear</button>
                    <button type="button" class="chip-btn" onclick="setSampleText('I feel so lonely, sad and heartbroken.')">😢 Sadness</button>
                </div>

                <button id="submitBtn" onclick="RunSentimentAnalysis()" class="btn-analyze">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    Run Sentiment Analysis
                </button>

                <div class="result-section">
                    <div class="result-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                        Result of Emotion Detection
                    </div>

                    <div id="system_response">
                        <div style="text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 20px;">
                            Enter text above and press <strong>Run Sentiment Analysis</strong> to see emotional insights.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
